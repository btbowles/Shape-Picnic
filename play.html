<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f8ec">
<title>Shape Picnic</title>
<link rel="icon" href="./assets/flower.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css?v=suite">
<script type="module" src="./suite.mjs?v=suite"></script>
</head>
<body>
<main class="picnic">
  <a class="back-games" href="./">‹ All games</a>
  <header class="topbar"><div class="brand"><img src="./assets/flower.svg" alt="" width="46" height="46"><h1 id="title">Shape Picnic</h1></div></header>
  <section id="play" class="game">
    <div class="meadow suite-meadow">
      <div class="hills" aria-hidden="true"></div>
      <h2 id="prompt"></h2>
      <div id="cue" class="cue"></div>
      <p id="progress"></p>
    </div>
    <div class="mat">
      <div id="board" class="choices" aria-labelledby="prompt"></div>
      <p id="feedback" class="feedback" role="status"></p>
    </div>
  </section>
  <section id="finish" class="finish" hidden>
    <img src="./assets/flower.svg" class="prize" alt="">
    <h2 id="finish-title">Nicely done!</h2>
    <p id="result"></p>
    <button id="replay" type="button">↻ Play again</button>
  </section>
</main>
</body>
</html>
